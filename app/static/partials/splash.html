<div id="splash" style="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#0d0d0d;overflow:hidden;transition:opacity .6s ease-out">
  <div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(139,58,58,.08),transparent 60%);pointer-events:none"></div>
  <div id="splash-inner" style="text-align:center;transform:scale(.85);opacity:0;transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .6s">
    <img src="/static/img/logo-animated.svg?v=3" alt="iChat" style="width:90px;height:135px;margin:0 auto 18px;filter:drop-shadow(0 0 30px rgba(139,58,58,.3))">
    <div style="font-family:Inter,system-ui,sans-serif;font-size:30px;font-weight:700;background:linear-gradient(135deg,#8b3a3a,#5e2626);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.5px">iChat</div>
    <div style="font-family:Inter,system-ui,sans-serif;font-size:11px;color:#6a7394;margin-top:8px;letter-spacing:2px;text-transform:uppercase">Every model · One workspace</div>
    <div style="margin-top:24px;width:40px;height:2px;background:linear-gradient(90deg,#8b3a3a,#5e2626);border-radius:2px;margin-left:auto;margin-right:auto;animation:splash-bar 2s ease-in-out infinite"><style>@keyframes splash-bar{0%,100%{transform:scaleX(1);opacity:.5}50%{transform:scaleX(2.5);opacity:1}}</style></div>
  </div>
</div>
<script>
(function(){
  var s=document.getElementById('splash');
  var inner=document.getElementById('splash-inner');
  requestAnimationFrame(function(){requestAnimationFrame(function(){inner.style.transform='scale(1)';inner.style.opacity='1'})});
  function hide(){s.style.opacity='0';setTimeout(function(){s.remove()},600)}
  if(document.readyState==='complete')setTimeout(hide,2400);
  else window.addEventListener('load',function(){setTimeout(hide,2400)});
  setTimeout(hide,3500);
})();
</script>
