<div id="splash" style="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#080b14;transition:opacity .5s">
  <div style="text-align:center">
    <img src="/static/img/logo-animated.svg" alt="iChat" style="width:80px;height:120px;margin:0 auto 16px">
    <div style="font-family:Inter,system-ui,sans-serif;font-size:28px;font-weight:700;background:linear-gradient(135deg,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.5px">iChat</div>
    <div style="font-family:Inter,system-ui,sans-serif;font-size:11px;color:#6b7280;margin-top:6px;letter-spacing:1.5px;text-transform:uppercase">Every model. One workspace.</div>
  </div>
</div>
<script>
(function(){
  var s=document.getElementById('splash');
  function hide(){s.style.opacity='0';setTimeout(function(){s.remove()},500)}
  if(document.readyState==='complete')hide();
  else window.addEventListener('load',function(){setTimeout(hide,600)});
  setTimeout(hide,4000);
})();
</script>
