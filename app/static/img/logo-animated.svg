<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150">
<defs>
  <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#a855f7"/>
    <stop offset="1" stop-color="#ec4899"/>
  </linearGradient>
  <mask id="pm" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="150">
    <rect width="100" height="150" fill="#fff"/>
    <rect x="49" y="52" width="2" height="6" rx="1" fill="#000"/>
    <rect x="48" y="66" width="4" height="12" rx="2" fill="#000"/>
    <rect x="46.5" y="88" width="7" height="18" rx="3.5" fill="#000"/>
  </mask>
</defs>
<g mask="url(#pm)" fill="url(#pg)">
  <circle cx="50" cy="24" r="14">
    <animate attributeName="r" values="14;15.2;14" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <path d="M41 50H59L80 138Q81 144 75 144H25Q19 144 20 138Z"/>
</g>
<!-- Chat bubble -->
<g>
  <animateTransform attributeName="transform" type="translate" values="0,0;0,-2;0,0" dur="3s" repeatCount="indefinite"/>
  <rect x="28" y="102" width="38" height="26" rx="8" fill="#ffffff" opacity=".95"/>
  <polygon points="40,128 46,136 52,128" fill="#ffffff" opacity=".95"/>
  <circle cx="40" cy="115" r="3" fill="#a855f7">
    <animate attributeName="opacity" values="1;.3;1" dur="1.4s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;3.5;3" dur="1.4s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="48" cy="115" r="3" fill="#c084fc">
    <animate attributeName="opacity" values="1;.3;1" dur="1.4s" begin=".2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;3.5;3" dur="1.4s" begin=".2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="56" cy="115" r="3" fill="#ec4899">
    <animate attributeName="opacity" values="1;.3;1" dur="1.4s" begin=".4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;3.5;3" dur="1.4s" begin=".4s" repeatCount="indefinite"/>
  </circle>
</g>
</svg>
