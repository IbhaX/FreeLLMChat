<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="iChat">
  <title>iChat</title>
  <desc>iChat — The dot is a speech bubble, and three typing dots inside it show the AI writing back.</desc>
  <defs><linearGradient id="ichat-tile" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="64">
      <stop offset="0" stop-color="#b84c4c"/><stop offset="1" stop-color="#742c2c"/>
    </linearGradient>
    <linearGradient id="ichat-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient></defs>
  
  <g transform="translate(0 0)">
    <g>
      <rect width="64" height="64" rx="14.5" fill="url(#ichat-tile)"/>
      <rect x=".5" y=".5" width="63" height="63" rx="14" fill="none" stroke="url(#ichat-sheen)"/>
    </g>
    <g><rect x="22" y="7.5" width="20" height="13" rx="5" fill="#fff"/><path d="M25 19 L23.2 24.4 L30.5 19.5 Z" fill="#fff" stroke="#fff" stroke-width=".6" stroke-linejoin="round"/></g>
    <g><circle cx="27.3" cy="14" r="1.5" fill="url(#ichat-tile)"/></g>
    <g><circle cx="32" cy="14" r="1.5" fill="url(#ichat-tile)"/></g>
    <g><circle cx="36.7" cy="14" r="1.5" fill="url(#ichat-tile)"/></g>
    <g><path d="M28.2 25 H35.8 L37.2 50.4 Q37.3 52.2 35.5 52.2 H28.5 Q26.7 52.2 26.8 50.4 Z" fill="#fff"/></g>
  </g>
</svg>
