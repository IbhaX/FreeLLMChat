<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Research - IbhaX</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/css/render.css">
<link rel="stylesheet" href="/static/css/activity.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
<script>document.documentElement.dataset.theme=localStorage.getItem('ui-theme')||'dark';</script>
<style>
  .rs-grid{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
  @media(max-width:900px){.rs-grid{grid-template-columns:1fr}
    .rs-grid>:first-child{order:2}}  /* mobile: report first, history below */
  .rs-run{padding:10px 12px;border-radius:var(--r-md);cursor:pointer;border:1px solid transparent}
  .rs-run:hover{background:var(--surface-2)}
  .rs-run.active{border-color:var(--accent-line);background:var(--accent-soft)}
  .rs-run .q{font-size:var(--t-sm);font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .rs-run .m{font-size:var(--t-xs);color:var(--text-3);margin-top:4px;display:flex;gap:8px}
  .rs-stage{display:flex;gap:10px;padding:6px 0;font-size:var(--t-sm);color:var(--text-2);align-items:baseline}
  .rs-stage .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;align-self:center}
  .rs-report{font-size:var(--t-md);line-height:1.65}
  .rs-report h2{margin:1.4em 0 .5em;font-size:var(--t-xl)}
  .rs-report h3{margin:1.2em 0 .4em;font-size:var(--t-lg)}

  /* ℞ prescription-pad metadata card */
  .rx-pad{border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:18px;
    background:color-mix(in srgb,var(--bg-1) 96%,var(--accent));overflow:hidden}
  .rx-head{display:flex;align-items:center;gap:14px;padding:14px 18px;
    border-bottom:3px double var(--line)}
  .rx-sigil{font-family:Georgia,'Times New Roman',serif;font-size:34px;line-height:1;
    color:var(--accent);font-weight:700}
  .rx-title{font-size:var(--t-xs);letter-spacing:.18em;text-transform:uppercase;
    color:var(--text-3);font-weight:700}
  .rx-topic{font-size:var(--t-md);font-weight:600;line-height:1.35;margin-top:2px}
  .rx-no{margin-left:auto;text-align:right;font-family:Georgia,serif;
    color:var(--text-3);font-size:var(--t-sm);white-space:nowrap}
  .rx-no b{display:block;color:var(--tx);font-size:var(--t-md)}
  .rx-body{display:grid;grid-template-columns:1fr 1fr;gap:0 26px;padding:12px 18px}
  @media(max-width:560px){.rx-body{grid-template-columns:1fr}}
  .rx-row{display:flex;align-items:baseline;gap:8px;padding:6px 0;
    border-bottom:1px dotted var(--line)}
  .rx-row:last-child{border-bottom:0}
  .rx-k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--text-3);font-weight:700;flex:none;min-width:74px}
  .rx-v{font-family:Georgia,'Times New Roman',serif;font-size:var(--t-sm);
    color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rx-foot{padding:8px 18px;border-top:1px solid var(--line);
    font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);
    display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

  /* Print/PDF: isolate the pad + report on a white paper surface. */
  @media print{
    body *{visibility:hidden}
    #reportPrint,#reportPrint *{visibility:visible}
    #reportPrint{position:absolute;inset:0 auto auto 0;width:100%;border:0;
      box-shadow:none;margin:0;padding:12px 4px;
      /* force paper colors regardless of the active theme */
      --bg-1:#ffffff;--bg-0:#ffffff;--tx:#111111;--text-2:#333333;
      --text-3:#666666;--line:#dddddd;--accent:#1a1a1a;
      --accent-soft:#f5f5f5;--accent-line:#cccccc;background:#fff;color:#111}
    .msg-actions,.alog-dash,.ui-btn,.alog,.alog-dash{display:none!important}
  }
  /* Ambient backdrop — accent grid + GSAP-drifting nodes; brighter while a
     run is live. Decorative only; hidden from print and screen readers. */
  .rs-backdrop{position:fixed;inset:0;pointer-events:none;z-index:0;
    overflow:hidden;transition:background 1s}
  .rs-backdrop.is-live{background:
    radial-gradient(ellipse at 25% 15%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 55%),
    radial-gradient(ellipse at 80% 62%,color-mix(in srgb,var(--success) 7%,transparent),transparent 55%)}
  .rs-neural{position:absolute;inset:0;
    background-image:
      repeating-linear-gradient(0deg,color-mix(in srgb,var(--accent) 8%,transparent) 0 1px,transparent 1px 40px),
      repeating-linear-gradient(90deg,color-mix(in srgb,var(--accent) 8%,transparent) 0 1px,transparent 1px 40px);
    -webkit-mask-image:radial-gradient(ellipse at 50% 35%,#000 0%,transparent 72%);
    mask-image:radial-gradient(ellipse at 50% 35%,#000 0%,transparent 72%)}
  .rs-neural i{position:absolute;width:6px;height:6px;border-radius:50%;
    background:var(--accent);opacity:.6;
    box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 15%,transparent),
      0 0 16px color-mix(in srgb,var(--accent) 50%,transparent)}
  .ui-main{position:relative;z-index:1}
  @media print{.rs-backdrop{display:none}}
  @media (prefers-reduced-motion: reduce){.rs-neural i{display:none}}
</style>
</head>
<body>
<div class="rs-backdrop" id="backdrop" aria-hidden="true"><div class="rs-neural"><i></i><i></i><i></i><i></i><i></i></div></div>
<main class="ui-main">
  <div class="ui-page" style="max-width:1200px">
    <div class="ui-pagehead">
      <button class="ui-btn ui-btn-ghost ui-btn-icon" data-app-back="/" title="Back"></button>
      <button class="ui-btn ui-btn-ghost ui-btn-icon" id="menuBtn" style="display:none">☰</button>
      <div>
        <h1>Research Center</h1>
        <div class="sub">Deep multi-agent investigation with verified sources</div>
      </div>
      <div class="acts">
        <button class="ui-btn ui-btn-sm" id="bookBtn" disabled>📖 Textbook</button>
        <button class="ui-btn ui-btn-sm" id="printBtn" disabled>⎙ Print/PDF</button>
        <button class="ui-btn ui-btn-sm" id="exportBtn" disabled>↓ Export MD</button>
      </div>
    </div>

    <div class="ui-card ui-card-pad" style="margin-bottom:16px">
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <input id="q" class="ui-input" style="flex:1;min-width:260px"
          placeholder="Research anything… e.g. 'Compare solid-state battery approaches for EVs'">
        <select id="mode" class="ui-select" style="width:130px">
          <option value="">General</option>
          <option value="academic">Academic</option>
          <option value="technical">Technical</option>
          <option value="market">Market</option>
        </select>
        <select id="depth" class="ui-select" style="width:130px">
          <option value="">Auto depth</option>
          <option value="quick">Quick</option>
          <option value="standard" selected>Standard</option>
          <option value="deep">Deep</option>
        </select>
        <select id="model" class="ui-select" style="width:190px"><option value="auto">auto (smart route)</option></select>
        <button id="runBtn" class="ui-btn ui-btn-primary">Run research</button>
        <button id="stopBtn" class="ui-btn" style="display:none;color:var(--error);border-color:var(--error)">■ Stop</button>
      </div>
      <div id="stages" style="margin-top:12px"></div>
    </div>

    <div class="rs-grid">
      <div>
        <div class="sec-title">Research history</div>
        <div class="ui-card" id="runs" style="padding:6px"></div>
      </div>
      <div>
        <div class="sec-title">Report</div>
        <div class="ui-card ui-card-pad" id="reportPrint">
          <div id="rxpad"></div>
          <div id="report" class="rs-report">
            <p class="tx-3" style="text-align:center;padding:48px 0">Run a research query or open a saved report.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="/static/js/theme.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/app-nav.js"></script>
<script src="/static/js/admin-shell.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="/static/js/motion.js"></script>
<script src="/static/js/render/ns.js"></script>
<script src="/static/js/render/ComponentRegistry.js"></script>
<script src="/static/js/render/ResponseClassifier.js"></script>
<script src="/static/js/render/MarkdownRenderer.js"></script>
<script src="/static/js/render/CodeRenderer.js"></script>
<script src="/static/js/render/TableRenderer.js"></script>
<script src="/static/js/render/ListRenderer.js"></script>
<script src="/static/js/render/PersonCard.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="/static/js/render/ChartRenderer.js"></script>
<script src="/static/js/render/Cards.js"></script>
<script src="/static/js/render/JsonViewer.js"></script>
<script src="/static/js/render/StatusRenderers.js"></script>
<script src="/static/js/render/ActivityLog.js"></script>
<script src="/static/js/render/MediaRenderer.js"></script>
<script src="/static/js/render/InteractiveRenderer.js"></script>
<script src="/static/js/render/Visuals.js"></script>
<script src="/static/js/render/DiagramRenderer.js"></script>
<script src="/static/js/render/SuggestedPrompts.js"></script>
<script src="/static/js/render/MessageActions.js"></script>
<script src="/static/js/render/ResponseRenderer.js"></script>
<script src="/static/js/render/StreamingRenderer.js"></script>
<script src="/static/js/render/LiveRun.js"></script>
<script src="/static/js/research.js"></script>
</body>
</html>
