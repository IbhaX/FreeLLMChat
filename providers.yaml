# Nova Gateway provider seed file.
# Refreshed: 2026-11-08
# IMPORTANT:
# - Free-tier eligibility and quotas can vary by account, region, model, and provider policy.
# - null/omitted limits mean unknown; do not treat them as unlimited.
# - Prefer dynamic model discovery for aggregators with frequently changing free catalogs.
# - Verify docs_url and account dashboard before production use.

providers:
  - name: ollama
    display_name: Ollama (local)
    adapter: ollama
    base_url: http://localhost:11434/v1
    auth_style: none
    rotation_strategy: round_robin
    default_models: []
    limits: {concurrency: 2, request_timeout_s: 180}
    requires_card: false
    commercial_ok: true
    auto_route_tags: [local, self-hosted]
    docs_url: https://github.com/ollama/ollama/blob/main/docs/api.md
    notes: >-
      Local Ollama server; no API key needed. The host is auto-detected at
      startup and via POST /admin/ollama/scan (OLLAMA_HOST is honored, then
      localhost:11434 / 127.0.0.1:11434). Models pulled on the host
      (/api/tags) are discovered and become routable automatically; request
      them as ollama/<model> or by model name.
    verified_on: "2026-11-15"
    pricing: {input_per_mtok: 0.0, output_per_mtok: 0.0, currency: USD, note: "local — free, no key"}

  - name: gemini
    display_name: Google Gemini API (AI Studio)
