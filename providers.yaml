# FreeLLM Gateway provider seed file.
# Refreshed: 2026-11-08
# IMPORTANT:
# - Free-tier eligibility and quotas can vary by account, region, model, and provider policy.
# - null/omitted limits mean unknown; do not treat them as unlimited.
# - Prefer dynamic model discovery for aggregators with frequently changing free catalogs.
# - Verify docs_url and account dashboard before production use.

providers:
  - name: gemini
    display_name: Google Gemini API (AI Studio)
    adapter: openai_compat
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    auth_style: bearer
    default_env_key: GEMINI_API_KEY
    default_models:
      - gemini-3.8-flash
      - gemini-3.5-flash-lite
    limits: {}
    daily_reset_tz: America/Los_Angeles
    requires_card: false
    commercial_ok: true
    rotation_strategy: least_used
    auto_route_tags: [fast, general, coding]
    docs_url: https://ai.google.dev/gemini-api/docs/models
    notes: >
      Use current stable model IDs. Free-tier quotas are model- and project-specific;
      verify the AI Studio quota page. Gemini 2.5 models are legacy for new projects
      and Google recommends newer model families.
    verified_on: "2026-11-08"

  - name: groq
    display_name: GroqCloud
    adapter: openai_compat
    base_url: https://api.groq.com/openai/v1
    auth_style: bearer
    default_env_key: GROQ_API_KEY
    default_models:
      - openai/gpt-oss-120b
      - openai/gpt-oss-20b
      - qwen/qwen3.8-27b
    limits:
      rpm: 30
      rpd: 1000
      tpm: 8000
      tpd: 200000
    requires_card: false
    commercial_ok: false
    rotation_strategy: least_used
    auto_route_tags: [fast, coding, general]
    docs_url: https://console.groq.com/docs/rate-limits
    notes: >
      Base free-plan limits shown for GPT-OSS models; actual limits are model- and
      organization-specific. Read rate-limit headers and do not apply these figures
      blindly to every model. Confirm commercial terms before production use.
    verified_on: "2026-11-08"

  - name: openrouter
    display_name: OpenRouter (dynamic free-model routing)
    adapter: openai_compat
    base_url: https://openrouter.ai/api/v1
    auth_style: bearer
    default_env_key: OPENROUTER_API_KEY
    extra_headers:
      HTTP-Referer: http://localhost:8000
      X-Title: FreeLLM Gateway
    default_models:
      - openrouter/free
    limits:
      rpm: 20
      rpd: 50
    requires_card: false
    commercial_ok: false
    rotation_strategy: round_robin
    auto_route_tags: [general, coding, fast]
    docs_url: https://openrouter.ai/docs/api-reference/limits
    notes: >
      Prefer openrouter/free instead of pinning model IDs because the free catalog
      changes frequently. Free model variants are generally limited to 20 RPM and
      50 requests/day; the daily limit increases to 1,000 after at least $10 in
      purchased credits. Provider/model terms still apply; verify commercial rights.
    verified_on: "2026-11-08"

  - name: cloudflare
    display_name: Cloudflare Workers AI
    adapter: cloudflare
    base_url: https://api.cloudflare.com/client/v4/accounts/{account_id}/ai/v1
    auth_style: bearer
    default_env_key: CLOUDFLARE_API_TOKEN
    account_id_env: CLOUDFLARE_ACCOUNT_ID
    default_models:
      - "@cf/deepseek-ai/deepseek-v4.1-flash-1017"
      - "@cf/zai-org/glm-5.3"
      - "@cf/google/gemma-4-26b-a4b-it"
      - "@cf/qwen/qwen3.8-27b"
    limits:
      daily_neurons: 10000
    daily_reset_tz: UTC
    requires_card: false
    commercial_ok: true
    rotation_strategy: least_used
    auto_route_tags: [fast, coding, general]
    docs_url: https://developers.cloudflare.com/workers-ai/models/
    notes: >
      Free Workers allocation is 10,000 Neurons/day, resetting at 00:00 UTC.
      Cloudflare announced removals for several older models effective November
      20, 2026; these defaults use the announced replacement families. Check the
      live catalog and per-model billing requirements before use.
    verified_on: "2026-11-08"

  - name: cohere
    display_name: Cohere (trial/evaluation)
    adapter: openai_compat
    base_url: https://api.cohere.ai/compatibility/v1
    auth_style: bearer
    default_env_key: COHERE_API_KEY
    default_models:
      - command-a-03-2025
      - command-r7b-12-2024
      - north-mini-code
    limits:
      rpm: 20
      monthly_calls: 1000
    requires_card: false
    commercial_ok: false
    rotation_strategy: least_used
    auto_route_tags: [coding, general]
    docs_url: https://docs.cohere.com/v2/docs/rate-limits
