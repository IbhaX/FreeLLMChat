# FreeLLM Gateway provider seed file.
# Refreshed: 2026-11-08
# IMPORTANT:
# - Free-tier eligibility and quotas can vary by account, region, model, and provider policy.
# - null/omitted limits mean unknown; do not treat them as unlimited.
# - Prefer dynamic model discovery for aggregators with frequently changing free catalogs.
# - Verify docs_url and account dashboard before production use.

providers:
  - name: gemini
    display_name: Google Gemini API (AI Studio)
    adapter: openai_compat
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    auth_style: bearer
    default_env_key: GEMINI_API_KEY
    default_models:
      - gemini-3.6-flash
      - gemini-3.5-flash
      - gemini-flash-lite-latest
      - gemini-3.8-flash
    limits: {est_tpd: 1500000}
    daily_reset_tz: America/Los_Angeles
    requires_card: false
    commercial_ok: true
    rotation_strategy: least_used
    auto_route_tags: [fast, general, coding]
    docs_url: https://ai.google.dev/gemini-api/docs/models
    notes: Free tier via AI Studio; models auto-discovered via /models.
    verified_on: "2026-11-10"

  - name: groq
    display_name: GroqCloud
    adapter: openai_compat
    base_url: https://api.groq.com/openai/v1
    auth_style: bearer
    default_env_key: GROQ_API_KEY
    default_models:
      - openai/gpt-oss-120b
      - openai/gpt-oss-20b
      - llama-3.3-70b-versatile
      - qwen/qwen3-32b
    limits: {est_tpd: 500000}
    requires_card: false
    commercial_ok: false
    rotation_strategy: least_used
    auto_route_tags: [fast, coding, general]
    docs_url: https://console.groq.com/docs/rate-limits
    notes: Free plan; per-model caps. Models auto-discovered.
    verified_on: "2026-11-09"

  - name: openrouter
    display_name: OpenRouter (dynamic free-model routing)
    adapter: openai_compat
    base_url: https://openrouter.ai/api/v1
    auth_style: bearer
    default_env_key: OPENROUTER_API_KEY
    extra_headers:
      HTTP-Referer: http://localhost:8000
      X-Title: FreeLLM Gateway
    default_models:
      - openrouter/free
    limits: {}
    requires_card: false
    commercial_ok: false
    rotation_strategy: round_robin
    auto_route_tags: [general, coding, fast]
    docs_url: https://openrouter.ai/docs/api-reference/limits
    notes: openrouter/free is a meta-router across the changing free catalog.
    verified_on: "2026-11-09"

  - name: cloudflare
    display_name: Cloudflare Workers AI
